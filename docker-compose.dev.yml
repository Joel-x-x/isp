version: '3.9'

# Solo infraestructura — el app NestJS corre local con `pnpm start:dev`
services:
  postgres:
    image: postgres:16-alpine
    container_name: isp-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: isp_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: isp
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp_user -d isp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: isp-redis-dev
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: isp-evolution-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      AUTHENTICATION_API_KEY: dev_evolution_key
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://isp_user:dev_password@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://isp-redis-dev:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"
      # Apunta al app corriendo local en la máquina host
      WEBHOOK_GLOBAL_URL: http://host.docker.internal:3000/webhook/evolution
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      CONFIG_SESSION_PHONE_VERSION: ""
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
    volumes:
      - evolution_dev_data:/evolution/instances

volumes:
  postgres_dev_data:
  evolution_dev_data:
